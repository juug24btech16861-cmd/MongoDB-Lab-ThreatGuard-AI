<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #172033;
        }

        header {
            background: white;
            padding: 22px 8%;
            border-bottom: 1px solid #ddd;
            color: #3156c9;
            font-size: 23px;
            font-weight: bold;
        }

        main {
            max-width: 850px;
            margin: 90px auto;
            padding: 30px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #00000010;
        }

        h1 {
            color: #3156c9;
        }

        p {
            line-height: 1.8;
            color: #68738a;
        }

        button {
            padding: 13px 25px;
            background: #3156c9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header>● ThreatGuard AI</header>
    <main>
        <div class="card">
            <h1>Welcome to ThreatGuard AI</h1>
            <p>Your AI-powered cybersecurity assistant.</p>
            <p>Ask questions about cybersecurity, programming,
                artificial intelligence and technology.</p>
            <button onclick="checkBackend()">Check Backend Connection</button>
            <div id="result"></div>
        </div>
    </main>
    <script>
        async function checkBackend() {
            const result = document.getElementById('result');
            result.textContent = 'Checking connection...';
            try {
                const response = await fetch('http://127.0.0.1:8001/system-status');
                if (!response.ok) throw new Error('Backend returned HTTP ' + response.status);
                const data = await response.json();
                result.textContent = 'Backend response received. Check browser console for details.';
                console.log(data);
            } catch (error) {
                result.textContent = 'Backend connection failed: ' + error.message;
            }
        }
    </script>
</body>

</html>
